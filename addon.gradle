
import org.gradle.api.tasks.GradleBuild

SourceSet functionalTestSet = null

sourceSets {
    functionalTestSet = create("functionalTest") {
        java {
            srcDir("src/functionalTest/java")
            compileClasspath += sourceSets.patchedMc.output + sourceSets.main.output
        }
    }
}

configurations { configs ->
    // Keep all dependencies from the main mod in the functional test mod
    named(functionalTestSet.compileClasspathConfigurationName).configure {it.extendsFrom(named("compileClasspath").get())}
    named(functionalTestSet.runtimeClasspathConfigurationName).configure {it.extendsFrom(named("runtimeClasspath").get())}
    named(functionalTestSet.annotationProcessorConfigurationName).configure {it.extendsFrom(named("annotationProcessor").get())}
}

tasks.register(functionalTestSet.jarTaskName, Jar) {
    from(functionalTestSet.output)
    archiveClassifier.set("functionalTests")
    // we don't care about the version number here, keep it stable to avoid polluting the tmp directory
    archiveVersion.set("1.0")
    destinationDirectory.set(layout.buildDirectory.dir("tmp"))
}
tasks.named("assemble").configure {
    dependsOn(functionalTestSet.jarTaskName)
}

def functionalTestRunProperty = "ae2.withFunctionalTests"
def withFunctionalTests = providers.gradleProperty(functionalTestRunProperty).map { it.toBoolean() }.orElse(false).get()
def isCi = providers.environmentVariable("CI").map { it.toBoolean() }.orElse(false).get()
def benchmarkProperty = "ae2.craftingBenchmark"
def withCraftingBenchmark = providers.gradleProperty(benchmarkProperty).map { it.toBoolean() }.orElse(false).get()

def addFunctionalTestsToRun = { JavaExec task ->
    task.dependsOn(functionalTestSet.jarTaskName)
    task.classpath(configurations.named(functionalTestSet.runtimeClasspathConfigurationName), tasks.named(functionalTestSet.jarTaskName))
}

tasks.register("runFunctionalTestServer", GradleBuild) {
    group = project.tasks.named("runServer").get().group
    description = "Runs the deobfuscated server with the AE2 functional test mod"
    setTasks(["runServer"])
    startParameter.projectProperties.put(functionalTestRunProperty, "true")
}

tasks.register("runFunctionalTestClient", GradleBuild) {
    group = project.tasks.named("runClient").get().group
    description = "Runs the deobfuscated client with the AE2 functional test mod"
    setTasks(["runClient"])
    startParameter.projectProperties.put(functionalTestRunProperty, "true")
}

tasks.register("runCraftingBenchmark", GradleBuild) {
    group = "verification"
    description = "Benchmarks repeated crafting CPU dispatches in an initialized Minecraft server"
    setTasks(["runServer"])
    startParameter.projectProperties.putAll(gradle.startParameter.projectProperties)
    startParameter.projectProperties.put(benchmarkProperty, "true")
}

if (withFunctionalTests || isCi || withCraftingBenchmark) {
    tasks.named("runServer", JavaExec).configure(addFunctionalTestsToRun)
}

if (withCraftingBenchmark) {
    tasks.named("runServer", JavaExec).configure {
        systemProperty(benchmarkProperty, "true")
        [units: "10000000", operations: "4096", warmup: "10", samples: "7",
         output: layout.buildDirectory.file("benchmarks/crafting.json").get().asFile.absolutePath].each { key, fallback ->
            def propertyName = "${benchmarkProperty}.${key}"
            systemProperty(propertyName, providers.gradleProperty(propertyName).orElse(fallback).get())
        }
        minHeapSize = "1G"
        maxHeapSize = "1G"
        jvmArgs("-XX:+UseG1GC")
    }
}

if (withFunctionalTests) {
    tasks.named("runClient", JavaExec).configure(addFunctionalTestsToRun)
}
